name: Release Images

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v1.0.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

# Serialize releases per tag so concurrent runs can't race on image pushes
# to the same ${REGISTRY}/${IMAGE}:${TAG} or on the GitHub release assets.
# Keyed on the tag name rather than github.ref so a workflow_dispatch for a
# tag shares the group with that tag's push run. Different tags can still
# run in parallel. We never want cancel-in-progress here: aborting a
# half-pushed image is worse than letting it finish.
concurrency:
  group: release-images-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  HUB_AGENT_IMAGE_NAME: hub-agent
  MEMBER_AGENT_IMAGE_NAME: member-agent
  REFRESH_TOKEN_IMAGE_NAME: refresh-token
  GO_VERSION: "1.26.6"

jobs:
  export-registry:
    uses: ./.github/workflows/setup-release.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}

  build-and-publish:
    needs: export-registry
    env:
      REGISTRY: ${{ needs.export-registry.outputs.registry }}
      TAG: ${{ needs.export-registry.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.export-registry.outputs.tag }}

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A single multi-arch `docker buildx build` per image publishes the full
      # tag (e.g. "v0.4.0") and, for stable releases, the short alias
      # (e.g. "0.4.0") in the same push - no separate retag step. RC images are
      # published under the long form ("v0.4.0-rc.1") for testers only: the
      # short-tag namespace is deliberately reserved for stable releases that
      # consumers can safely pin to, so RC tags get no short alias.
      - name: Build and push images with tag ${{ env.TAG }}
        env:
          VERSION: ${{ needs.export-registry.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "${TAG}" == *-rc.* ]]; then
            make push
          else
            make push IMAGE_EXTRA_TAG="${VERSION}"
          fi

      # Confirm every published tag is a real multi-arch manifest list rather
      # than a silently degraded single-arch image: a build that pushed only one
      # architecture would otherwise go unnoticed until a consumer on the other
      # architecture failed to pull. Stable releases also carry the short alias.
      - name: Verify images are multi-arch
        env:
          VERSION: ${{ needs.export-registry.outputs.version }}
        run: |
          set -euo pipefail
          tags="${TAG}"
          if [[ "${TAG}" != *-rc.* ]]; then
            tags="${tags} ${VERSION}"
          fi
          echo "✅ Verifying published images:"
          for IMAGE in ${{ env.HUB_AGENT_IMAGE_NAME }} ${{ env.MEMBER_AGENT_IMAGE_NAME }} ${{ env.REFRESH_TOKEN_IMAGE_NAME }}; do
            for tag in ${tags}; do
              ref="${{ env.REGISTRY }}/${IMAGE}:${tag}"
              echo "  - ${ref}"
              manifest="$(docker buildx imagetools inspect "${ref}")"
              for platform in linux/amd64 linux/arm64; do
                grep -q "Platform:.*${platform}" <<<"${manifest}" \
                  || { echo "::error::${ref} is missing platform ${platform}"; exit 1; }
              done
            done
          done

  # Publish the non-image release assets: the raw CRD bundle and the
  # cross-compiled kubectl-fleet archives. The CRD bundle lets consumers install
  # CRDs without pulling a Helm chart; it carries the unmodified CRDs the charts
  # install (no downstream-specific labels), split into crds/hub and crds/member
  # so each set can be applied to the right cluster. The kubectl-fleet archives
  # (one tar.gz/zip per OS/arch plus checksums.txt) give users, krew, and install
  # scripts a stable download URL instead of building from source. Runs after
  # the images are published so a release is only created once the build succeeds.
  publish-release-assets:
    needs: [export-registry, build-and-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.export-registry.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.export-registry.outputs.tag }}

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Package CRDs
        run: make crd-package TAG="${TAG}"

      - name: Build kubectl-fleet release archives
        run: make cli-package TAG="${TAG}"

      - name: Create or update the release and upload the assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          created_draft=""
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            # Any semver pre-release suffix (-rc.N, -alpha, -beta, ...) is a prerelease.
            prerelease=""
            case "${TAG}" in *-*) prerelease="--prerelease" ;; esac
            # Create as a draft first so a partially uploaded release is never public.
            # --verify-tag: `gh release create` creates the tag itself when it is
            # missing, pointing at the default branch's head. A tag that does not
            # exist at all already fails earlier, at build-and-publish's checkout,
            # so this guards the narrower case where the ref resolved to something
            # that is not the tag - the release would then point at a different
            # commit than the images were built from.
            gh release create "${TAG}" --title "${TAG}" --generate-notes --draft --verify-tag ${prerelease}
            created_draft="true"
          fi
          gh release upload "${TAG}" \
            "_crd-package/kubefleet-crds-${TAG}.tgz" \
            "_crd-package/kubefleet-crds-${TAG}.tgz.sha256" \
            _cli-package/* \
            --clobber
          # Only publish releases this job created; never flip a maintainer's existing release.
          if [ "${created_draft}" = "true" ]; then
            gh release edit "${TAG}" --draft=false
          elif [ "$(gh release view "${TAG}" --json isDraft --jq .isDraft)" = "true" ]; then
            echo "::warning::Release ${TAG} already existed as a draft; the assets were uploaded but the release was left unpublished. Publish it manually."
          fi
