name: Helm Chart Publisher

on:
  push:
    # Pre-release tags (e.g. v0.4.0-rc.1) build images via release.yml but
    # must not land in the public Helm index. The negative pattern below
    # filters them out; workflow_dispatch can still publish a specific
    # tag manually if ever needed.
    tags:
      - "v*.*.*"
      - "!v*-rc.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v1.0.0)"
        required: true
        type: string
permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  export-registry:
    uses: ./.github/workflows/setup-release.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}

  publish-github-pages:
    needs: export-registry
    runs-on: ubuntu-latest
    # Only the gh-pages publish needs serialization: helm-gh-pages always
    # rewrites the gh-pages branch, so concurrent runs for different tags
    # would race. The OCI publish below pushes immutable per-tag blobs and
    # is safe to run in parallel across tags, so it stays unguarded.
    concurrency:
      group: helm-chart-publish-gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
          fetch-depth: 0
      # Without chart_version/app_version the action packages charts/*/Chart.yaml
      # verbatim, and those are pinned in-tree at 0.1.0/v0.1.0. Every release
      # therefore republished "hub-agent 0.1.0" with appVersion v0.1.0 - and
      # because `helm repo index --merge` lets the newly generated entry win a
      # version collision, each release silently replaced the contents of the
      # same 0.1.0 tarball. The OCI publish below has always passed both values
      # (see `make helm-push`); this brings the index in line with it.
      - name: Publish Helm chart to GitHub Pages
        uses: stefanprodan/helm-gh-pages@0ad2bb377311d61ac04ad9eb6f252fb68e207260 # v1.7.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          charts_dir: charts
          target_dir: charts
          chart_version: ${{ needs.export-registry.outputs.version }}
          app_version: ${{ needs.export-registry.outputs.tag }}
          linting: on

      # Unknown inputs to an action are a warning, not an error, so a rename or
      # typo above would silently restore the old behaviour with a green build.
      # Check the branch the action just wrote instead of trusting that it
      # accepted them.
      - name: Verify the published index carries this release
        env:
          TAG: ${{ needs.export-registry.outputs.tag }}
          CHART_VERSION: ${{ needs.export-registry.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          index="$(git cat-file blob "FETCH_HEAD:charts/index.yaml")"
          for chart in hub-agent member-agent; do
            packaged="charts/${chart}-${CHART_VERSION}.tgz"
            if ! git cat-file -e "FETCH_HEAD:${packaged}" 2>/dev/null; then
              echo "::error::gh-pages has no ${packaged}; the chart was not published for this release."
              exit 1
            fi
            app_version="$(git cat-file blob "FETCH_HEAD:${packaged}" \
              | tar -xzO "${chart}/Chart.yaml" \
              | awk -F': ' '/^appVersion:/ {gsub(/"/, "", $2); print $2}')"
            if [ "${app_version}" != "${TAG}" ]; then
              echo "::error::gh-pages ${chart} appVersion (${app_version}) does not match release tag (${TAG})"
              exit 1
            fi
            # index.yaml is what `helm repo add` reads; a tarball on the branch
            # that the index does not list is invisible to users, so assert the
            # index gained this version rather than only that the file exists.
            if ! grep -qF "${chart}-${CHART_VERSION}.tgz" <<<"${index}"; then
              echo "::error::gh-pages charts/index.yaml does not list ${chart} ${CHART_VERSION}"
              exit 1
            fi
            echo "✅ gh-pages publishes and indexes ${chart} ${CHART_VERSION} (appVersion ${app_version})"
          done

  publish-oci:
    needs: export-registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push Helm charts to GHCR via Makefile
        run: |
          set -euo pipefail

          RELEASE_TAG="${{ needs.export-registry.outputs.tag }}"
          CHART_VERSION="${{ needs.export-registry.outputs.version }}"
          OCI_REGISTRY="${{ needs.export-registry.outputs.registry }}/charts"

          make helm-push REGISTRY="${OCI_REGISTRY}" TAG="${RELEASE_TAG}" CHART_VERSION="${CHART_VERSION}"

      - name: Verify chart appVersion matches release tag
        run: |
          set -euo pipefail

          RELEASE_TAG="${{ needs.export-registry.outputs.tag }}"
          CHART_VERSION="${{ needs.export-registry.outputs.version }}"
          EXPECTED_APP_VERSION="${RELEASE_TAG}"

          rm -rf .helm-verify
          mkdir -p .helm-verify

          for chart in hub-agent member-agent; do
            helm pull "oci://${{ needs.export-registry.outputs.registry }}/charts/${chart}" --version "${CHART_VERSION}" --destination .helm-verify >/dev/null
            packaged=".helm-verify/${chart}-${CHART_VERSION}.tgz"
            actual_app_version=$(tar -xOf "${packaged}" "${chart}/Chart.yaml" | awk -F': ' '/^appVersion:/ {gsub(/"/, "", $2); print $2}')
            if [[ "${actual_app_version}" != "${EXPECTED_APP_VERSION}" ]]; then
              echo "ERROR: ${chart} appVersion (${actual_app_version}) does not match release tag (${EXPECTED_APP_VERSION})"
              exit 1
            fi
            echo "✅ ${chart} appVersion=${actual_app_version} matches release tag=${EXPECTED_APP_VERSION}"
          done

          rm -rf .helm-verify
