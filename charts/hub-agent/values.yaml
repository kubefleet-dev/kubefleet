# Default values for hub-agent.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/kubefleet-dev/kubefleet/hub-agent
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

logVerbosity: 5
# logFileMaxSize is the maximum size (in MB) a log file can grow to before rotating. Must have a
# value -- the hub-agent binary rejects an empty --log_file_max_size at startup. 1800 matches the
# binary's own documented default.
logFileMaxSize: 1800

enableWebhook: true
webhookServiceName: fleetwebhook
enableGuardRail: true
webhookClientConnectionType: service
enableWorkload: false
# useCertManager enables cert-manager for webhook certificate management
# When enabled, cert-manager must be installed as a prerequisite (it is not installed automatically by this chart)
# and a Certificate resource will be created
useCertManager: false
# webhookCertSecretName is ONLY used when useCertManager=true
# It specifies the name of the Secret where cert-manager stores the certificate
# Example:
# webhookCertSecretName: fleet-webhook-server-cert

forceDeleteWaitTime: 15m0s
clusterUnhealthyThreshold: 3m0s
resourceSnapshotCreationMinimumInterval: 30s
resourceChangesCollectionDuration: 15s

namespace: fleet-system

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 128Mi

tolerations: []

affinity: {}

enableClusterInventoryAPI: true
enableStagedUpdateRunAPIs: true
enableEvictionAPIs: true

enablePprof: true
pprofPort: 6065

hubAPIQPS: 250
hubAPIBurst: 1000
MaxConcurrentClusterPlacement: 100
ConcurrentResourceChangeSyncs: 20
MaxFleetSizeSupported: 100

additionalConfigData: {}
additionalConfigDataMountPath: /etc/kubefleet/additional-config

# enableAdmissionPolicyManager: false (the default) omits --enable-admission-policy-manager
# from the container args entirely, rather than rendering it as =false -- this flag postdates
# some published hub-agent releases (v0.3.1 and earlier don't have it: "flag provided but not
# defined"), so leaving it unset when disabled keeps this chart deployable against those older
# images too. Set to true only when deploying an image built from a source tree that has the
# flag (cmd/hubagent/options/webhooks.go).
enableAdmissionPolicyManager: false
admissionPolicyManagerConfigName: ""
