apiVersion: v2
name: hub-agent
description: A Helm chart for hub agent

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

# The chart version, following Semantic Versioning (https://semver.org/).
# Placeholder: leave this alone when changing the chart. The release workflow
# packages charts with the release version, so this value is never published.
version: 0.1.0

# The version of the application being deployed. Also a placeholder, which the
# release workflow overwrites with the release tag. Templates read it back as
# .Chart.AppVersion to default the image tag, so a published chart runs the
# image from the release it was published for. Installing straight from a git
# checkout gets this placeholder instead, which names no published image: pass
# --set image.tag with a released version.
appVersion: "v0.1.0"
