replicaCount: 1

image:
  repository: ghcr.io/kubefleet-dev/kubefleet/member-agent
  pullPolicy: Always
  tag: ""

logVerbosity: 5

refreshtoken:
  repository: ghcr.io/kubefleet-dev/kubefleet/refresh-token
  pullPolicy: Always
  tag: ""

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 128Mi

tolerations: []

affinity: {}

namespace: 
  fleet-system

config:
  provider: secret
  hubURL : https://<hub_cluster_api_server_ip>:<hub_cluster_port>
  memberClusterName: membercluster-sample
  hubCA: <certificate-authority-data>
  identityKey: "identity-key-path"
  identityCert: "identity-cert-path"
  # CABundle is a file path to a CA bundle used to verify the hub cluster's TLS certificate.
  # Optional and mutually exclusive with hubCA: leave empty ("") to trust the hub's CA via
  # hubCA (or the system trust store) instead.
  CABundle: ""
  azureCloudConfig:
    cloud: ""
    tenantId: ""
    subscriptionId: ""
    useManagedIdentityExtension: false
    userAssignedIdentityID: ""
    aadClientId: ""
    aadClientSecret: ""
    resourceGroup: ""
    userAgent: ""
    location: ""
    vnetName: ""
    vnetResourceGroup: ""

secret:
  name: "hub-kubeconfig-secret"
  namespace: "default"

azure:
  clientid: <member_cluster_clientID>

tlsClientInsecure: false
useCAAuth: false

enablePprof: true
pprofPort: 6065
hubPprofPort: 6066

priorityQueue:
  enabled: false
  priorityLinearEquationCoeffA: -3
  priorityLinearEquationCoeffB: 100

enableNamespaceCollectionInPropertyProvider: false
